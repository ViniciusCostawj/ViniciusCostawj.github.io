<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Vinicius Costa</title>
    <style>
        /* CSS Básico e Reset */
        :root {
            --cor-fundo: #f4f7f6;
            --cor-texto: #333;
            --cor-cartao: #ffffff;
            --cor-primaria: #007bff;
            --cor-sombra: rgba(0, 0, 0, 0.1);
            --cor-tag: #e9ecef;
            --cor-tag-texto: #555;
            --cor-borda: #ddd;
        }

        /* Dark Mode (Modo Escuro) */
        @media (prefers-color-scheme: dark) {
            :root {
                --cor-fundo: #121212;
                --cor-texto: #e0e0e0;
                --cor-cartao: #1e1e1e;
                --cor-primaria: #0099ff;
                --cor-sombra: rgba(0, 0, 0, 0.4);
                --cor-tag: #333;
                --cor-tag-texto: #ccc;
                --cor-borda: #444;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            line-height: 1.6;
            padding: 20px;
        }

        /* Container Principal */
        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Cabeçalho */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .header .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .header .links a {
            text-decoration: none;
            color: var(--cor-primaria);
            font-weight: 500;
            font-size: 1.1rem;
            transition: opacity 0.3s;
        }

        .header .links a:hover {
            opacity: 0.7;
        }
        
        /* Seção Sobre Mim */
        .sobre {
            text-align: center;
            max-width: 700px; /* Limita a largura do texto */
            margin: 40px auto; /* Centraliza */
        }
        
        .sobre h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--cor-primaria);
        }
        
        .sobre p {
            font-size: 1.1rem;
            line-height: 1.7;
        }
        
        /* Seção Habilidades (NOVO) */
        .habilidades {
            margin-bottom: 40px;
        }
        
        .habilidades h2 {
            font-size: 2rem;
            border-bottom: 2px solid var(--cor-borda);
            padding-bottom: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .habilidades h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--cor-texto);
            font-weight: 600;
        }
        
        .habilidades .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
